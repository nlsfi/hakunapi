$config.version=2

api.title=HTML background map test API
api.version=1.0
api.description=Test API for HTML background maps

servers=dev
servers.dev.url=https://localhost/hakuna
servers.dev.description=Test

getfeatures.limit.default=100
getfeatures.limit.max=1000

formats=geojson,html
formats.geojson.type=json
formats.html.type=html
formats.html.84.tileUrl=https://example.org/WGS84_Pseudo-Mercator/{z}/{y}/{x}.png

db.classes=fi.nls.hakunapi.source.HakunaTestSource
db=db

srid=3067,3857
srid.3067.proj4=+proj=utm +zone=35 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs
default.collections.srid=3067,3857

collections=fence,survey

collections.fence.geometry.type=POINT
collections.fence.properties=name
collections.fence.extent.spatial.crs84=-110,-60,140,30
collections.fence.testdata.1=1;POINT(1 1);Fence A

collections.survey.geometry.type=POINT
collections.survey.properties=name,surveyed
collections.survey.properties.surveyed.type=DATE
collections.survey.time=surveyed
collections.survey.extent.temporal=2020-01-01T00:00:00Z,2021-01-01T00:00:00Z
collections.survey.testdata.1=1;POINT(2 2);Survey A;2020-06-01
