$config.version=2

api.title=Hakunapi OGC API Tiles Auto-Publish Test
api.version=1.0
api.description=Test service for tiles.vector auto-publish toggle.

servers=dev
servers.dev.url=https://localhost/hakuna
servers.dev.description=Test

getfeatures.limit.default=1000
getfeatures.limit.max=10000

srid=3067,4258,3857

db.classes=fi.nls.hakunapi.source.HakunaTestSource
db=db

collections=geom_collection,nongeom_collection

# A collection with geometry -> auto-published as a vector tile layer.
collections.geom_collection.type=test
collections.geom_collection.db=db
collections.geom_collection.table=geom_table
collections.geom_collection.extent.spatial.crs84=-110,-60,140,30
collections.geom_collection.title=Geometry Collection
collections.geom_collection.srid=3067,4258,3857
collections.geom_collection.id.mapping=fid
collections.geom_collection.geometry.mapping=geom
collections.geom_collection.geometry.type=POINT
collections.geom_collection.properties=my_prop
collections.geom_collection.testdata.1=1;POINT(1 1 100);11

# A collection without geometry -> must NOT get vector tiles.
collections.nongeom_collection.type=test
collections.nongeom_collection.db=db
collections.nongeom_collection.table=nongeom_table
collections.nongeom_collection.title=Non-geometry Collection
collections.nongeom_collection.srid=3067
collections.nongeom_collection.id.mapping=fid
collections.nongeom_collection.properties=my_prop
collections.nongeom_collection.testdata.1=1;11

# OGC API - Tiles: auto-publish vector tiles for every geometry collection,
# no per-collection configuration. The vector tile source is discovered on the
# classpath via ServiceLoader; the generator is selected by type id.
tiles.vector=true
default.tiles.layers.vectortile.generator=empty
